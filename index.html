/* ---------- Direction artistique professionnelle Nour ---------- */

.card,.kp div,.ov{border-color:var(--bd);border-radius:12px;box-shadow:0 2px 10px #17243a08}
.b{background:#234b78;border:1px solid #234b78;box-shadow:none;border-radius:8px}

th{background:#f0f4f8;color:#596b80}

const DEMO_SLUG={A:'taherhaddad',B:'belhouane',C:'ibnkhaldoun',D:'farhathached',E:'chebbi'};
const GEN_NAMES={A:['M. Chokri Ben Youssef','Mme Latifa Zghal'],B:['M. Walid Ben Slimane','Mme Sana Karoui'],C:['Mme Dalila Ayadi','M. Tahar Mabrouk'],D:['M. Anis Gaaloul','Mme Nadia Rekik'],E:['Mme Houda Sfar','M. Fethi Mahjoub']};
// Comptes des écoles de démonstration : prénom.nom@école.tn, mot de passe « demo » (une seule fois par compte).
function nameAccounts(){
  const taken=new Set(D.users.map(u=>String(u.email).toLowerCase())),plain=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
  for(const sc_ of D.schools){
    const code=sc_.code,slug=DEMO_SLUG[code];if(!slug)continue;sc_.slug=sc_.slug||slug;
    for(const u of D.users){
      if(u.school_id!==sc_.id||u.nm||!/@nour\.tn$/i.test(u.email))continue;
      if(/^(dir|admin|biblio|compta|ens2?|parent[23]?|eleve)[.@]/.test(u.email))u.demo=true;
      if(u.role==='administrateur'&&u.name==='Administrateur')u.name=GEN_NAMES[code][0];
      if(u.role==='bibliothecaire'&&u.name==='Bibliothécaire')u.name=GEN_NAMES[code][1];
      const t=u.name.replace(/^(M\.|Mme|Mlle|Mr)\s+/i,'').trim().split(/\s+/),first=plain(t[0]||'compte'),last=plain(t.slice(1).join(''));
      let base=first+(last?'.'+last:''),em=base+'@'+slug+'.tn',n=2;
      while(taken.has(em))em=base+(n++)+'@'+slug+'.tn';
      taken.add(em);u.email=em;u.pw=H('demo');u.nm=1;
    }
  }
}
function load(){
  try{D=JSON.parse(localStorage.getItem(LS))}catch(e){D=null}
  if(!D||typeof D!=='object'||!Array.isArray(D.schools)||!Array.isArray(D.users))D=seed();
  const COLS=['students','classes','grades','pays','msgs','notifs','logs','hw','subs','books','loans'];
  for(const k of COLS)if(!Array.isArray(D[k]))D[k]=[];
  if(!D.schools.length)D=seed();
  // Multi-écoles : les écoles de démonstration manquantes sont ajoutées une seule fois (données existantes conservées).
  if(!D._demoSet){
    const t=seed();
    for(const b of t.schools){
      if(D.schools.some(x=>x.code===b.code))continue;
      if(t.users.some(u=>u.school_id===b.id&&D.users.some(x=>x.email===u.email)))continue;
      const nid=Math.max(0,...D.schools.map(x=>Number(x.id)||0))+1;
      D.schools.push({...b,id:nid});
      for(const k of Object.keys(t))if(k!=='schools'&&Array.isArray(t[k]))D[k].push(...t[k].filter(x=>x.school_id===b.id).map(x=>({...x,school_id:nid})));
    }

// Contrôle de l'emploi du temps : un enseignant, une salle ou une classe (donc ses élèves) ne peuvent être à deux endroits en même temps.
const ttOverlap=(a,b)=>a.day===b.day&&a.start<b.end&&b.start<a.end;
const ttSame=(x,y)=>String(x||'').trim().toLowerCase()===String(y||'').trim().toLowerCase();
function ttConflict(v,ignoreId,rows){
  for(const x of (rows||T('timetables'))){
    if(x.id===ignoreId||!ttOverlap(v,x))continue;
    const when=x.day+' '+x.start+'–'+x.end;
    if(x.cid===v.cid)return'La classe '+cn(v.cid)+' a déjà une séance ('+x.sub+') le '+when+' : ses élèves ne peuvent pas être à deux endroits à la fois.';
    if(v.tid&&x.tid===v.tid)return un(v.tid)+' enseigne déjà '+x.sub+' en '+cn(x.cid)+' le '+when+'.';
    if(v.room&&x.room&&ttSame(v.room,x.room))return'La salle « '+v.room+' » est déjà occupée par '+cn(x.cid)+' ('+x.sub+') le '+when+'.';
  }
  return'';
}
// Réparation unique des emplois du temps existants : on conserve la première séance, on retire l'enseignant ou la salle en double.
function repairTT(){
  D.ttFix=D.ttFix||[];if(!S||!S.school_id||D.ttFix.includes(S.school_id))return;D.ttFix.push(S.school_id);
  const ok=[];let n=0;
  for(const x of T('timetables')){
    if(ok.some(y=>y.cid===x.cid&&ttOverlap(x,y))){D.timetables=D.timetables.filter(z=>z!==x);n++;continue}
    if(x.tid&&ok.some(y=>y.tid===x.tid&&ttOverlap(x,y))){x.tid='';n++}
    if(x.room&&ok.some(y=>y.room&&ttSame(y.room,x.room)&&ttOverlap(x,y))){x.room='';n++}
    ok.push(x);
  }
  if(n){log('Emplois du temps : '+n+' conflit(s) enseignant/salle/classe corrigé(s)');}
  save();
}
function eligibleTeacherSubjects(id){

function repairTTQualifications(){
  if(!S||!S.school_id)return;
  D.ttQualFix=D.ttQualFix||[];
  if(D.ttQualFix.includes(S.school_id))return;
  const rows=T('timetables');let changed=0;
  for(const x of rows){
    if(!x.tid||eligibleTeacherSubjects(x.tid).includes(x.sub))continue;
    const replacement=US(['enseignant']).find(u=>eligibleTeacherSubjects(u.id).includes(x.sub)&&!ttConflict({...x,tid:u.id},x.id,rows));
    x.tid=replacement?replacement.id:'';
    changed++;
  }
  D.ttQualFix.push(S.school_id);
  if(changed){log('Vérification des matières enseignées : '+changed+' séance(s) corrigée(s)');save();}
}

const DOC_MAX=10*1024*1024,DOC_N=5;
const fsize=n=>n<1024?n+' o':n<1048576?Math.round(n/1024)+' Ko':(n/1048576).toFixed(1)+' Mo';
const FDB={
  open(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB indisponible'));const r=indexedDB.open('nour_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('f',mode),rq=fn(t.objectStore('f'));t.oncomplete=()=>{db.close();res(rq&&rq.result)};t.onerror=t.onabort=()=>{db.close();rej(t.error)}})},
  put(k,blob){return this.run('readwrite',s=>s.put(blob,k))},
  get(k){return this.run('readonly',s=>s.get(k))},
  del(k){return this.run('readwrite',s=>s.delete(k))}
};
const DOCKINDS=[['Cours','Cours'],['Document','Document'],['Support','Support de révision']];
function documentForm(){
  if(!isTeacher())return toast('Action réservée aux enseignants.',1);
  const cls=tcl();
  if(!cls.length)return toast('Aucune classe ne vous est attribuée.',1);
  form('Partager un cours ou document',[
    {n:'title',l:'Titre *',a:'required maxlength="100"'},
    {n:'cid',l:'Classe destinataire * (seuls les élèves et parents de cette classe verront le document)',o:cls.map(c=>[c.id,c.name+' – '+T('students').filter(x=>!x.del&&x.cid===c.id).length+' élève(s)'])},
    {n:'kind',l:'Type',o:DOCKINDS},
    {n:'files',l:'Fichiers joints (jusqu’à '+DOC_N+', '+fsize(DOC_MAX)+' maximum chacun)',t:'file',a:'multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.odt,.txt,.png,.jpg,.jpeg,.webp,.zip"'},
    {n:'url',l:'Lien externe (facultatif)',t:'url',a:'placeholder="https://..."'},
    {n:'description',l:'Description (facultatif)',a:'maxlength="300"'}
  ],()=>'');
  $('#f').onsubmit=async e=>{
    e.preventDefault();
    const f=$('#f'),fe=$('#fe'),btn=f.querySelector('button.b'),v=Object.fromEntries(new FormData(f)),files=[...f.elements.namedItem('files').files];
    const title=String(v.title||'').trim(),url=String(v.url||'').trim(),description=String(v.description||'').trim();
    if(!title)return fe.textContent='Le titre est obligatoire';
    if(!cls.some(c=>c.id===v.cid))return fe.textContent='Classe invalide';
    if(!DOCKINDS.some(k=>k[0]===v.kind))return fe.textContent='Type invalide';
    if(url&&!/^https?:\/\//i.test(url))return fe.textContent='Le lien doit commencer par http:// ou https://';
    if(!files.length&&!url)return fe.textContent='Joignez au moins un fichier ou indiquez un lien';
    if(files.length>DOC_N)return fe.textContent='Maximum '+DOC_N+' fichiers par envoi';
    const bad=files.find(x=>x.size===0||x.size>DOC_MAX);
    if(bad)return fe.textContent='« '+bad.name+' » est vide ou dépasse '+fsize(DOC_MAX);
    btn.disabled=true;fe.textContent=files.length?'Envoi des fichiers en cours…':'';
    const meta=[],cleanup=()=>Promise.all(meta.map(m=>FDB.del(m.id).catch(()=>{})));
    try{for(const file of files){const id=uid();await FDB.put(id,file);meta.push({id,name:file.name,size:file.size,type:file.type||''})}}
    catch(err){await cleanup();btn.disabled=false;fe.textContent='Impossible d’enregistrer les fichiers (stockage du navigateur indisponible ou plein).';return}
    const d=add('documents',{title,cid:v.cid,kind:v.kind,url,description,files:meta,tid:S.id,date:td()});
    if(!save()){D.documents=D.documents.filter(x=>x!==d);await cleanup();btn.disabled=false;fe.textContent='Enregistrement impossible : stockage plein.';return}
    nt(T('students').filter(s=>!s.del&&s.cid===v.cid).flatMap(fam),'Nouveau '+(v.kind==='Cours'?'cours':'document')+' : '+title);
    log('Document partagé : '+title+' ('+meta.length+' fichier(s)) / '+cn(v.cid));
    cm();toast('Document partagé avec les élèves et parents de la classe');
  };
}

    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=m.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
  }catch(err){toast('Téléchargement impossible.',1)}

function compose(){
  const r=S.role,formFields=[];
  if(r==='enseignant'){
    const parents=US(['parent']).filter(u=>vis().some(s=>s.pid===u.id));
    formFields.push({n:'aud',l:'Destinataire',o:[['one','Un parent précis'],['parents','Tous les parents de mes classes'],['students','Tous les élèves de mes classes'],['all','Parents et élèves de mes classes']]},
      {n:'target',l:'Parent',o:parents.map(u=>[u.id,u.name])});
  }else if(r==='directeur'){
    formFields.push({n:'aud',l:'Destinataires',o:[['all','Toute l’école'],['parents','Tous les parents'],['ens','Tous les enseignants']]});
  }else if(r==='parent'||r==='eleve'){
    formFields.push({n:'aud',l:'Destinataire',o:[['dir','Direction'],...(r==='parent'?[['ens','Enseignant de la classe']]:[])]});
  }else{
    formFields.push({n:'aud',l:'Destinataires',o:[['parents','Parents']]});
  }
  form('Nouveau message',[...formFields,{n:'subj',l:'Objet *',a:'required maxlength="100"'},{n:'body',l:'Message *',t:'textarea'}],v=>{
    v.subj=v.subj.trim();v.body=v.body.trim();if(!v.subj||!v.body)return'Objet et message obligatoires';
    let to=[];
    if(r==='enseignant'){
      const students=T('students').filter(s=>!s.del&&myC().includes(s.cid));
      if(v.aud==='one'){if(!parentsValid(v.target,students))return'Choisissez un parent de vos classes';to=[v.target]}
      if(v.aud==='parents'||v.aud==='all')to=students.map(s=>s.pid);
      if(v.aud==='students'||v.aud==='all')to=to.concat(US(['eleve']).filter(u=>students.some(s=>s.id===u.sid)).map(u=>u.id));
    }else if(r==='directeur'){
      if(v.aud==='all')to=[...US(['parent','eleve','enseignant','comptable','administrateur','bibliothecaire']).map(u=>u.id)];
      else to=US(v.aud==='parents'?['parent']:['enseignant']).map(u=>u.id);
    }else if(r==='parent'||r==='eleve'){
      to=v.aud==='dir'?US(['directeur']).map(u=>u.id):T('classes').filter(c=>myC().includes(c.id)).map(c=>c.tid).filter(Boolean);
    }else to=US(['parent']).map(u=>u.id);
    to=[...new Set(to)].filter(id=>id&&id!==S.id);
    if(!to.length)return'Aucun destinataire valide';
    send(to,v.subj,v.body);log('Message envoyé : '+v.subj+' ('+to.length+' destinataires)');save();render();
  });
}
function parentsValid(id,students){return !!id&&students.some(s=>s.pid===id)}


/* ===== Ajouts ciblés : paiement parent par carte et emplois du temps complets =====
   Le reste de l'application et toutes les fonctionnalités existantes sont conservés.
   Paiement en mode démonstration uniquement : aucune donnée de carte n'est stockée
   ou envoyée, et aucun débit bancaire réel n'est effectué.
*/
function parentCardPay(){
  if(!S||S.role!=='parent')return toast('Cette fonction est réservée au parent.',1);
  if(Y!==CUR)return toast('Le paiement est disponible pour l’année scolaire en cours.',1);
  const children=vis().filter(st=>solde(st.id)>0);
  if(!children.length)return toast('Aucun montant restant à payer.');
  $('#m').innerHTML=`<div class="md" role="dialog" aria-modal="true" aria-label="Paiement parent par carte">
    <h2>Paiement des frais scolaires</h2>
    <p class="mu">Démonstration uniquement : n’utilisez pas une vraie carte. Les données saisies restent dans ce formulaire, ne sont ni enregistrées ni transmises, et aucun débit réel n’a lieu. Utilisez uniquement des données de carte de test.</p>
    <form id="parentCardForm">
      <label>Enfant concerné *
        <select name="sid" required>${children.map(st=>`<option value="${esc(st.id)}">${esc(st.pre+' '+st.nom)} — solde : ${M(solde(st.id))}</option>`).join('')}</select>
      </label>
      <label>Montant à payer (DT) *
        <input name="amount" type="number" min="0.001" step="0.001" max="${solde(children[0].id).toFixed(3)}" value="${solde(children[0].id).toFixed(3)}" required>
      </label>
      <label>Type de carte *
        <select name="brand" required><option value="Visa">Visa</option><option value="Mastercard">Mastercard</option></select>
      </label>
      <label>Nom du titulaire (test) *
        <input name="holder" maxlength="80" autocomplete="off" required>
      </label>
      <label>Numéro de carte de test *
        <input name="number" inputmode="numeric" maxlength="23" placeholder="4242 4242 4242 4242" autocomplete="off" required>
      </label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label>Date d’expiration *<input name="expiry" inputmode="numeric" placeholder="MM/AA" maxlength="5" autocomplete="off" required></label>
        <label>CVV de test *<input name="cvv" inputmode="numeric" maxlength="4" autocomplete="off" required></label>
      </div>
      <p id="parentCardError" class="er" role="alert"></p>
      <button class="b" type="submit">Confirmer le paiement (simulation)</button>
      <button class="b2" type="button" onclick="cm()">Annuler</button>
    </form>
  </div>`;
  $('#m').hidden=false;
  const formEl=$('#parentCardForm');
  formEl.onsubmit=e=>{
    e.preventDefault();
    const f=Object.fromEntries(new FormData(formEl));
    const st=get('students',f.sid), amount=Number(f.amount);
    const digits=String(f.number||'').replace(/\D/g,'');
    const expiry=/^(0[1-9]|1[0-2])\/\d{2}$/.test(f.expiry||'');
    const cvv=/^\d{3,4}$/.test(f.cvv||'');
    let err='';
    if(!st||!children.some(x=>x.id===st.id))err='Enfant invalide.';
    else if(!(amount>0)||amount>solde(st.id)+1e-9)err='Montant invalide ou supérieur au solde restant.';
    else if(!String(f.holder||'').trim())err='Veuillez saisir le nom du titulaire.';
    else if(digits.length<13||digits.length>19)err='Numéro de carte de test invalide.';
    else if(!expiry||!cvv)err='Vérifiez la date d’expiration et le CVV de test.';
    if(err){$('#parentCardError').textContent=err;return;}
    const n=Math.max(0,...T('pays').filter(p=>p.year===Y).map(p=>Number(String(p.no||'').split('-').pop())||0))+1;
    const no=`R-${sch().code}-${Y.slice(0,4)}-${String(n).padStart(4,'0')}`;
    const brand=f.brand==='Mastercard'?'Mastercard':'Visa';
    const last4=digits.slice(-4);
    add('pays',{sid:st.id,year:Y,amt:amount,mode:'Carte '+brand,date:new Date().toISOString().slice(0,10),no,by:'Paiement parent (simulation)',online:true,cardBrand:brand,cardLast4:last4});
    log(`Paiement parent simulé ${no} par ${brand} **** ${last4}`);
    save();
    cm();
    toast('Paiement de démonstration enregistré. Aucun débit bancaire réel.');
  };
}

function ensureAllTimetablesNour(){
  if(!S||!S.school_id)return;
  repairTT();
  const classes=T('classes');
  const modules=T('modules');
  const teachers=US(['enseignant']).map(u=>u.id);
  const days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
  const slots=[['08:00','09:00'],['09:15','10:15'],['10:30','11:30'],['13:00','14:00']];
  const fallback=SUB.map(x=>x[0]);
  let added=0;
  classes.forEach((cl,ci)=>{
    // Ne complète que les classes sans emploi du temps, sans toucher aux séances déjà saisies.
    D.ttSeeded=D.ttSeeded||[];if(D.ttSeeded.includes(cl.id))return;D.ttSeeded.push(cl.id);if(T('timetables').some(t=>t.cid===cl.id))return;
    const subjects=modules.length?modules.map(m=>m.name):fallback;
    days.forEach((day,di)=>{
      slots.forEach(([start,end],si)=>{
        const rows=T('timetables'),subject=subjects[(di*slots.length+si+ci)%subjects.length];
        const module=modules.find(m=>m.name===subject),cand=[module?.tid,cl.tid,...teachers].filter(Boolean);
        const probe={day,start,end,cid:cl.id};
        // Enseignant disponible à ce créneau (préférence : responsable de la matière, puis titulaire) ; sinon séance sans enseignant.
        const tid=cand.find(t=>!ttConflict({...probe,tid:t},null,rows))||'';
        let room='Salle '+(ci+1);if(ttConflict({...probe,room},null,rows))room='';
        if(ttConflict({...probe,tid,room},null,rows))return;
        D.timetables.push({id:uid(),school_id:S.school_id,cid:cl.id,day,start,end,sub:subject,tid,room});
        added++;
      });
    });
  });
  if(added){
    log('Emplois du temps hebdomadaires créés pour '+classes.length+' classe(s)');
    save();
  }
}

let TC='';
const TT_DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
function ttRows(){

function ttGrid(rows,showClass,editable){
  if(!rows.length)return'<p class="mu">Aucune séance.</p>';
  const days=TT_DAYS.filter((d,i)=>i<5||rows.some(t=>t.day===d));
  const slots=[...new Set(rows.map(t=>t.start+'|'+t.end))].sort();
  const cell=(d,sl)=>{const [a,b]=sl.split('|');return `<div class="tc">${rows.filter(t=>t.day===d&&t.start===a&&t.end===b).map(t=>`<div class="ts" style="--h:${hue(t.sub)}"><b>${esc(t.sub)}</b><span>${esc(showClass?cn(t.cid):un(t.tid))}</span>${t.room?`<small>${esc(t.room)}</small>`:''}${editable?`<button class="tx" onclick="delSeance('${t.id}')" aria-label="Supprimer la séance ${esc(t.sub)} du ${esc(t.day)}">×</button>`:''}</div>`).join('')}</div>`};
  return `<div class="ov"><div class="tg" style="--n:${days.length}"><div class="th"></div>${days.map(d=>`<div class="th">${d}</div>`).join('')}${slots.map(sl=>{const [a,b]=sl.split('|');return `<div class="tt">${esc(a)}<br><span class="mu">${esc(b)}</span></div>`+days.map(d=>cell(d,sl)).join('')}).join('')}</div></div>`;
}
function ttBlocks(editable){

function gridSvg(W,H,L,R,Tp,B,max,fm){let g='';for(let i=0;i<=4;i++){const y=Tp+(H-Tp-B)*(1-i/4);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${L-6}" y="${y+3}" text-anchor="end" font-size="10" fill="var(--mu)">${fm(max*i/4)}</text>`}return g}
function barChart(lab,val,o={}){
  const n=lab.length;if(!n||!val.some(v=>v>0))return noData;

const CARD_MODES=MODES.filter(m=>/^Carte/.test(m));
const luhn=d=>{let s=0,alt=false;for(let i=d.length-1;i>=0;i--){let n=+d[i];if(alt){n*=2;if(n>9)n-=9}s+=n;alt=!alt}return s%10===0};
const cardBrand=(d,mode)=>d[0]==='4'?'Visa':/^(5[1-5]|2[2-7])/.test(d)?'Mastercard':(/Visa/.test(mode)?'Visa':/Mastercard/.test(mode)?'Mastercard':'Carte');
function cardCheck(v,mode){const d=String(v.cnum||'').replace(/\D/g,'');
  if(!String(v.holder||'').trim())return'Nom du titulaire de la carte obligatoire';
  if(d.length<13||d.length>19||!luhn(d))return'Numéro de carte invalide (carte de test : 4242 4242 4242 4242)';
  if(/Visa/.test(mode)&&d[0]!=='4')return'Ce numéro n’est pas une carte Visa';
  if(/Mastercard/.test(mode)&&!/^(5[1-5]|2[2-7])/.test(d))return'Ce numéro n’est pas une carte Mastercard';
  const m=/^(0[1-9]|1[0-2])\/(\d{2})$/.exec(String(v.cexp||''));if(!m)return'Date d’expiration invalide (format MM/AA)';
  const n=new Date(),yy=+m[2]+2000,mm=+m[1];if(yy<n.getFullYear()||(yy===n.getFullYear()&&mm<n.getMonth()+1))return'Carte expirée';
  if(!/^\d{3,4}$/.test(String(v.ccvv||'')))return'Cryptogramme (CVV) invalide';return''}
const cardFields=()=>[{n:'holder',l:'Titulaire de la carte *',a:'autocomplete="off" maxlength="80"'},{n:'cnum',l:'Numéro de carte *',a:'inputmode="numeric" maxlength="23" placeholder="4242 4242 4242 4242" autocomplete="off"'},{n:'cexp',l:'Date d’expiration (MM/AA) *',a:'inputmode="numeric" maxlength="5" placeholder="MM/AA" autocomplete="off"'},{n:'ccvv',l:'Cryptogramme (CVV) *',t:'password',a:'inputmode="numeric" maxlength="4" autocomplete="off"'}];

  if(e)e.addEventListener('input',()=>{let d=e.value.replace(/\D/g,'').slice(0,4);e.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d})}

    let card=null;if(CARD_MODES.includes(v.mode)){const e=cardCheck(v,v.mode);if(e)return e;const d=v.cnum.replace(/\D/g,'');card={cardBrand:cardBrand(d,v.mode),cardLast4:d.slice(-4),cardHolder:v.holder.trim()}}

function compressStudentPhoto(file){
  return new Promise((resolve,reject)=>{
    if(!file)return resolve('');
    if(!/^image\/(jpeg|png|webp)$/i.test(file.type))return reject(new Error('Choisissez une image JPG, PNG ou WebP.'));
    if(file.size>5*1024*1024)return reject(new Error('La photo doit faire moins de 5 Mo.'));
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Lecture de la photo impossible.'));
    reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Image invalide.'));img.onload=()=>{
      const maxW=420,maxH=520,ratio=Math.min(1,maxW/img.width,maxH/img.height),canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78));
    };img.src=reader.result};reader.readAsDataURL(file);
  });
}
stForm=function(id){
  if(!isAdmin())return toast('Action réservée à l’administrateur.',1);
  const s=id?get('students',id):null;if(id&&!s)return toast('Élève introuvable.',1);
  const fields=[{n:'nom',l:'Nom *',a:'required maxlength="40"'},{n:'pre',l:'Prénom *',a:'required maxlength="40"'},{n:'nais',l:'Date de naissance *',t:'date',a:'required'},{n:'cid',l:'Classe *',o:T('classes').map(c=>[c.id,c.name])},{n:'pid',l:'Parent *',o:US(['parent']).map(u=>[u.id,u.name])},{n:'tel',l:'Téléphone (8 chiffres) *',a:'required inputmode="numeric"'},{n:'files',l:'Photo de l’élève (JPG, PNG ou WebP — facultatif)',t:'file',a:'accept="image/jpeg,image/png,image/webp"'}];
  asyncForm(s?'Modifier l’élève':'Nouvel élève',fields,s||{},async(v,meta,files)=>{
    v.nom=v.nom.trim();v.pre=v.pre.trim();const age=(Date.now()-new Date(v.nais))/31557600000,c=get('classes',v.cid);
    if(!v.nom||!v.pre)return'Nom et prénom obligatoires';if(!(age>=4&&age<=14))return'Âge hors primaire (4 à 14 ans)';if(!/^\d{8}$/.test(v.tel))return'Téléphone : 8 chiffres exactement';if(!c)return'Classe invalide';if(!US(['parent']).find(u=>u.id==v.pid))return'Parent invalide';
    if(T('students').filter(x=>!x.del&&x.cid==v.cid&&x.id!=id).length>=c.cap)return'Classe complète (capacité '+c.cap+')';
    let photo=s?.photo||'';
    if(files?.[0]){try{photo=await compressStudentPhoto(files[0])}catch(e){return e.message}}
    const rec={nom:v.nom,pre:v.pre,nais:v.nais,cid:v.cid,pid:v.pid,tel:v.tel,...(photo?{photo}:{})};
    if(s){const oldPid=s.pid;log('Élève modifié '+s.mat);Object.assign(s,rec);if(oldPid!==v.pid)log('Parent modifié pour '+s.mat)}
    else{const n=Math.max(0,...T('students').map(x=>Number(String(x.mat).slice(String(sch().code).length))||0))+1;add('students',{...rec,mat:sch().code+String(n).padStart(4,'0')});log('Élève ajouté '+v.nom)}
    save();render();return'';
  });
};
